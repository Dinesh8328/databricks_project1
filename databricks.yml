bundle:
  name: sales-autoloader-pipeline

workspace:
  host: https://dbc-dfb6cfad-58be.cloud.databricks.com

resources:
  jobs:
    autoloader_pipeline:
      name: AutoLoader_Bronze_Sales_Pipeline

      tasks:
        - task_key: setup_infrastructure
          notebook_task:
            notebook_path: ./notebooks/setup/setup_catalog.py
            base_parameters:
              env: prod
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode

        - task_key: run_autoloader
          depends_on:
            - task_key: setup_infrastructure
          notebook_task:
            notebook_path: ./notebooks/bronze/autoloader_bronze.py
            base_parameters:
              env: prod
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode

        - task_key: validate_data
          depends_on:
            - task_key: run_autoloader
          notebook_task:
            notebook_path: ./notebooks/validation/validate_bronze.py
            base_parameters:
              env: prod
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode

      schedule:
        quartz_cron_expression: "0 0 21 * * ?"
        timezone_id: Asia/Kolkata
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - dineshthanneru123@gmail.com